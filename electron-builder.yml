appId: com.contextheavydiagrams.app
productName: Context-Heavy Diagrams
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# The licence and the third-party notices go where a person can read them, not only inside
# app.asar (ADR 0165): next to the program on Windows and Linux, in Resources on macOS (a loose
# file in the root of a .app makes codesign fail). They are listed per platform on purpose: a
# top-level `extraFiles` would also apply on macOS.
win:
  executableName: context-heavy-diagrams
  # chd launcher next to the exe (ADR 0106), and bin/chd.cmd, the only folder the installer
  # can put on the PATH (ADR 0162)
  extraFiles:
    - from: LICENSE
      to: LICENSE.txt
    - from: THIRD-PARTY-NOTICES.md
      to: THIRD-PARTY-NOTICES.md
    - from: build/launchers/chd.cmd
      to: chd.cmd
    - from: build/launchers/chd-path.cmd
      to: bin/chd.cmd
# Wizard-style, still per-user (no elevation). Needed so the installer can ask the
# .chd-association and AI-features questions on an options page (ADR 0108).
# No global `fileAssociations` on purpose: electron-builder would register .chd
# on Windows unconditionally. build/installer.nsh writes it, behind a checkbox.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Declares the .chd document type (ADR 0108); Finder double-clicks arrive as an
  # open-file event. Icon omitted: reuses the app icon until branding.
  fileAssociations:
    - ext: chd
      name: Context-Heavy Diagram
      description: Context-Heavy Diagram
      mimeType: application/vnd.context-heavy-diagram+json
      role: Editor
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: LICENSE
      to: LICENSE.txt
    - from: THIRD-PARTY-NOTICES.md
      to: THIRD-PARTY-NOTICES.md
  # Only what the app really does: open and save diagram files wherever the user
  # keeps them. No camera or microphone (ADR 0112 also denies every web permission).
  extendInfo:
    - NSDocumentsFolderUsageDescription: Context-Heavy Diagrams opens and saves your diagram files in your Documents folder.
    - NSDownloadsFolderUsageDescription: Context-Heavy Diagrams opens and saves your diagram files in your Downloads folder.
  notarize: false
  # One DMG for Apple Silicon and Intel (ADR 0166).
  target:
    - target: dmg
      arch: universal
  # Ad-hoc signed ("-"), not Developer ID signed: an unsigned arm64 build is refused with "is
  # damaged" instead of the usual "unidentified developer" prompt. The hardened runtime needs the
  # library-validation entitlement with an ad-hoc signature and buys nothing without notarisation,
  # so it is off. With a Developer ID certificate, remove `identity` and turn it back on.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Declares the .chd MIME type and adds it to the desktop entry for deb/snap
  # (ADR 0108). AppImage cannot register an association by itself.
  fileAssociations:
    - ext: chd
      name: Context-Heavy Diagram
      description: Context-Heavy Diagram
      mimeType: application/vnd.context-heavy-diagram+json
      role: Editor
  # Pinned because the chd launcher hardcodes it (same value electron-builder derives from package.json's name).
  executableName: context-heavy-diagrams
  # chd launcher next to the executable (ADR 0106)
  extraFiles:
    - from: LICENSE
      to: LICENSE.txt
    - from: THIRD-PARTY-NOTICES.md
      to: THIRD-PARTY-NOTICES.md
    - from: build/launchers/chd
      to: chd
  target:
    - AppImage
    - snap
    - deb
  maintainer: Magnus Elden <5158595+NoobsDeSroobs@users.noreply.github.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No `publish` block on purpose: the app has no auto-update and makes no network
# requests (ADR 0113).
