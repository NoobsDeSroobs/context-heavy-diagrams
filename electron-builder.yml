appId: com.contextheavydiagramtool.app
productName: Context-Heavy Diagram Tool (Preview)
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: context-heavy-diagram-tool
  # chd launcher next to the exe (ADR 0106)
  extraFiles:
    - from: build/launchers/chd.cmd
      to: chd.cmd
# Wizard-style, still per-user (no elevation). Needed so the installer can ask the
# .chd-association and AI-features questions on an options page (ADR 0108).
# No global `fileAssociations` on purpose: electron-builder would register .chd
# on Windows unconditionally. build/installer.nsh writes it, behind a checkbox.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Declares the .chd document type (ADR 0108); Finder double-clicks arrive as an
  # open-file event. Icon omitted: reuses the app icon until branding.
  fileAssociations:
    - ext: chd
      name: Context-Heavy Diagram
      description: Context-Heavy Diagram
      mimeType: application/vnd.context-heavy-diagram+json
      role: Editor
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Declares the .chd MIME type and adds it to the desktop entry for deb/snap
  # (ADR 0108). AppImage cannot register an association by itself.
  fileAssociations:
    - ext: chd
      name: Context-Heavy Diagram
      description: Context-Heavy Diagram
      mimeType: application/vnd.context-heavy-diagram+json
      role: Editor
  # Pinned because the chd launcher hardcodes it (same value electron-builder derives from package.json's name).
  executableName: context-heavy-diagram-tool
  # chd launcher next to the executable (ADR 0106)
  extraFiles:
    - from: build/launchers/chd
      to: chd
  target:
    - AppImage
    - snap
    - deb
  maintainer: Context-Heavy Diagram Tool (Preview)
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
