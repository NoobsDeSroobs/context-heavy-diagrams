name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small `.chd` file that shows the problem helps a lot. Remove anything private first; attached files are public.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Help → About, or `version` in package.json if you run from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the Linux distribution and desktop, error text.
