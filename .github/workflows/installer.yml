# Builds the installers and checks them (ADR 0165, ADR 0166), without publishing anything. Run it
# by hand from the Actions tab when something the installers are made from has changed
# (`build/`, `electron-builder.yml`, the package files, an Electron or electron-builder upgrade),
# so a problem shows up before a release tag, not on it. No secrets, read-only token.
name: Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:win -- --publish never
      - run: node scripts/smoke-installer.mjs

  linux:
    name: Linux builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:linux -- AppImage deb --publish never
      - run: node scripts/smoke-packaged.mjs

  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:mac -- --publish never
      - run: node scripts/smoke-packaged.mjs
